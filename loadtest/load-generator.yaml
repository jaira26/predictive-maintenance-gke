apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          for i in 1 2 3 4 5 6 7 8; do
            (while true; do
              wget -q -O- --header='Content-Type: application/json' --post-data='{"type":"L","air_temperature_k":298.1,"process_temperature_k":308.6,"rotational_speed_rpm":1551,"torque_nm":65,"tool_wear_min":230}' http://model-api/predict > /dev/null
            done) &
          done
          wait
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
